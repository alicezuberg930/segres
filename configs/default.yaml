# Default configuration for SOAR high-resolution segmentation framework

# Model settings
model:
  cfg: "configs/models/soar_medium1.yaml"  # Model architecture YAML (nano, small, medium, large, xlarge)
  in_channels: 3               # Input channels (1 for grayscale, 3 for RGB)
  num_classes: 1               # Number of segmentation classes

# Data settings
data:
  data_root: ""           # Path to dataset root
  img_size: [1024, 1024] # Image size (height, width)
  batch_size: 1           # Batch size
  val_split: 0.1          # Validation split ratio
  num_workers: 2          # Number of data loading workers
  use_cache: true         # Use data caching

# Training settings
train:
  epochs: 50              # Number of training epochs
  lr: 0.0001              # Learning rate
  weight_decay: 0.00001   # Weight decay
  accumulate_grad_batches: 1 # Gradient accumulation steps
  device: "cuda"          # Device to use (cuda/cpu)
  use_amp: false          # Use automatic mixed precision
  use_ema: false           # Use exponential moving average
  ema_decay: 0.9999       # EMA decay rate
  grad_clip: 2.0          # Gradient clipping value
  save_interval: 5        # Save checkpoint every N epochs

# Checkpoint settings
checkpoint:
  dir: "checkpoints"      # Checkpoint directory
  resume: null            # Resume from checkpoint (path or "last")

# Validation settings
val:
  batch_size: 1           # Validation batch size
  save_dir: null          # Directory to save validation visualizations

# Prediction settings
predict:
  threshold: 0.5          # Prediction threshold
  min_area: 30            # Minimum component area
  close_kernel: 3         # Morphological closing kernel size
  output_dir: "predictions" # Output directory for predictions

# High-Resolution Loss settings
loss:
  # Region loss (engineered for <1% foreground pixel sparsity)
  region:
    type: dice_focal  # Options: dice_focal, dice_bce, focal, dice, tversky, focal_tversky
    weight: 1.0
    dice_weight: 1.0
    focal_weight: 1.0
    gamma: 2.0
    alpha: 0.25
  
  # Boundary loss (high-frequency edge precision for 1024x1024+ detail)
  boundary:
    enabled: true
    type: boundary_dice  # Options: boundary_dice, boundary_dist, boundary_bce
    weight: 0.3
  
  # Topological Structure loss (connectivity preservation for thin filaments & roads)
  structure:
    enabled: true
    type: cldice  # Options: cldice, skeleton
    weight: 0.2
    warmup_epochs: 3
  
  # Deep supervision (optional multi-scale feature alignment)
  deep_supervision: false
  deep_supervision_weights: [0.4, 0.3, 0.2, 0.1]


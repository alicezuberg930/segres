# SOAR1-u (Micro / SOAR-TRM) recursive resolution-preserving configuration
# Inspired by Samsung SAIL Montreal's TRM (Tiny Recursive Model)
# Capacity: ~0.034M parameters (33,705 binary, 34,689 4-class)
# Target Image Resolution: 1024x1024 to 2048x2048
# Key Architectural Properties:
#   - Parameter-Free 2D Haar Wavelet DWT Stem & Symmetric IDWT Reconstruction Head
#   - Single Weight-Shared Recursive Core across T time steps (T_train=3, T_infer=2..5)
#   - Global Context Module (FiLM) for 100% Canvas Effective Receptive Field from t=1
#   - Unbounded Logit Residual Space with Decoupled DC/HF Heads
#   - Gradient Checkpointing: Constant O(1) Memory during BPTT Training
nc: 1
channels: 3
scale: micro
type: recursive_micro

# Recursive architecture hyperparameters
architecture:
  wavelet: haar
  hidden_channels: 32
  num_steps: 3
  local_kernel: 7
  dilated_kernel: 7
  dilation: 2
  reduction: 4
  use_checkpointing: true
  hf_scale_init: 0.1
  step_size_bias_init: 1.0
